name: speicherlotse

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
  timescaledb:
    # The non-"oss" image: compression is not part of the Apache-licensed build.
    image: timescale/timescaledb:2.29.2-pg18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: speicherlotse
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep the data in a versioned subfolder, so the mount is the parent folder.
      - timescale-data:/var/lib/postgresql

volumes:
  timescale-data: